<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picksy</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Spinning Disc Background -->
    <div class="spinning-disc-bg">
        <div class="disc-outer">
            <div class="disc-inner">
                <div class="disc-label">
                    <div class="disc-text-top">PICKSY</div>
                    <div class="disc-center-hole"></div>
                    <div class="disc-text-bottom">PICKSY</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Main View -->
    <div class="app-container main-view">
        <!-- Practice Panel -->
        <div class="panel practice-panel">
            <div class="panel-header">
                <button class="menu-toggle">☰</button>
                <h1 class="logo">Picksy</h1>
                <div class="header-buttons">
                    <button class="past-toggle" id="past-toggle">Reviews</button>
                    <button class="chat-toggle" id="chat-toggle">Chat</button>
                </div>
            </div>
            
            <div class="practice-content">
                <!-- Microphone Display -->
                <div class="microphone-section">
                    <h2>Microphone</h2>
                    <div class="mic-display">
                        <div class="mic-visualization" id="mic-visualization">
                            <div class="mic-grid"></div>
                            <div class="mic-bars" id="mic-bars"></div>
                        </div>
                        <div class="mic-info">
                            <span class="mic-label">Mic value:</span>
                            <span class="mic-value" id="mic-value">Click to enable</span>
                        </div>
                    </div>
                </div>
                
                <!-- Score Bar -->
                <div class="score-section">
                    <h2>Score</h2>
                    <div class="score-display">
                        <div class="score-text">
                            <span class="score-label">Current Score:</span>
                            <span class="score-value" id="score-value">0%</span>
                        </div>
                        <div class="score-divider"></div>
                        <div class="level-display">
                            <span class="level-label">Level</span>
                            <span class="level-value">1/5</span>
                        </div>
                        <div class="score-bar-container">
                            <div class="score-bar" id="score-bar">
                                <div class="score-fill" id="score-fill"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- AI Chat Panel - removed, now a popup -->
    </div>

    <!-- Reviews View (Hidden by default) -->
    <div class="app-container reviews-view" id="reviews-view" style="display: none;">
        <div class="panel reviews-panel-full">
            <div class="panel-header">
                <button class="back-button" id="back-button">Back</button>
                <h1 class="logo">Reviews</h1>
            </div>
            
            <div class="reviews-content-full">
                <div class="reviews-list-full" id="reviews-list-full">
                    <div class="review-item">
                        <div class="review-header">
                            <span class="review-level">Level 1</span>
                            <span class="review-score">68%</span>
                        </div>
                        <div class="review-date">2023-07-11</div>
                    </div>
                    <div class="review-item">
                        <div class="review-header">
                            <span class="review-level">Level 1</span>
                            <span class="review-score">72%</span>
                        </div>
                        <div class="review-date">2023-07-10</div>
                    </div>
                    <div class="review-item">
                        <div class="review-header">
                            <span class="review-level">Level 1</span>
                            <span class="review-score">65%</span>
                        </div>
                        <div class="review-date">2023-07-09</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
